[project]
name = "n6k-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "n6k>=0.8.0",
]

# This is an application, not a library — uv manages the dependency env
# (so `uv run n6k dev` works) without trying to build/install the project itself.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.3.260530",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py314"
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true
# Every page dir has its own `data.py`; namespace-package bases keep those sibling
# modules distinct (app.foo.data vs app.bar.data) instead of colliding on "data".
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[tool.uv.sources]
# n6k = { path = "../server", editable = true }
